# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.jvmargs=-Xmx2048M

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
android.enableJetifier=true
android.useAndroidX=true

minSdkVersion=24
targetSdkVersion=28
compileSdkVersion=35

# --- shiroikuma-termux-api fork -------------------------------------------------------------
# Per-build version tail, bumped by the `buildFork` task after every successful build:
#   versionName = "<upstream name>+<base date>.<HH-MM>.g<sha8>+<NNN>", versionCode = <upstream code> * 10000 + N.
# It runs MONOTONICALLY and is NEVER reset: `master` follows upstream's branch tip, whose
# versionCode stands still between releases, and an installer compares versionCode alone — the
# date and sha in versionName are cosmetic. Resetting it on a sync that did not move upstream's
# versionCode would send our versionCode BACKWARDS and make every sync a downgrade.
BUILD_NUMBER=5

# Highest versionCode this repo has ever built; buildFork refuses to go at or below it.
LAST_BUILT_VERSION_CODE=10020004

# The termux-shared library this fork builds against: OUR build, published to mavenLocal by
# `./gradlew :termux-shared:publishReleasePublicationToMavenLocal` in ~/git/shiroikuma-termux
# (see its gradle.properties SHIROIKUMA_TERMUX_SHARED_VERSION). Upstream's JitPack artifact is
# excluded in app/shiroikuma.gradle; keep the two versions in step.
SHIROIKUMA_TERMUX_SHARED_VERSION=0.118.0-sk1
